repos:
  - repo: local
    hooks:
        - id: ruff-check
          name: ruff check
          description: "Run 'ruff check' for Python linting"
          entry: uv run ruff check --fix
          language: python
          types_or: [python, pyi, jupyter]
          args: []
          require_serial: true
          additional_dependencies: []
          minimum_pre_commit_version: '2.9.2'
    
        - id: ruff-format
          name: ruff format
          description: "Run 'ruff format' for Python formatting"
          entry: uv run ruff format
          language: python
          types_or: [python, pyi, jupyter]
          args: []
          require_serial: true
          additional_dependencies: []
          minimum_pre_commit_version: '2.9.2'

        - id: mypy
          name: mypy
          description: ''
          entry: uv run mypy
          language: python
          types_or: [python, pyi]
          args: []
          require_serial: true
          additional_dependencies: []
          minimum_pre_commit_version: '2.9.2'
